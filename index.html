<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SHUT UP SQUAT!!!">
<meta name="theme-color" content="#d92b2b" id="themeColorMeta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<title>SHUT UP SQUAT!!!</title>
<style>
:root{
  --bg:#f7f6f4; --card:#ffffff; --line:#e9e5e0; --line2:#d9d4ce;
  --txt:#211f1e; --sub:#8d8781; --red:#d92b2b; --redsoft:#fdeeee; --reddeep:#b81f1f;
  --ok:#1fa06a; --oksoft:#e7f6ef; --amber:#c98a12; --ambersoft:#fdf6e7; --sub2:#66605b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:132px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--red);padding:12px 16px 9px}
header h1{font-size:1.05rem;letter-spacing:.14em;font-weight:800;color:var(--txt)}
header h1 span{color:var(--red)}
header .tag{font-size:.6rem;color:var(--sub);letter-spacing:.24em;text-transform:uppercase}
main{padding:14px 14px 20px;max-width:560px;margin:0 auto}
/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;color:var(--sub);font-size:.68rem;padding:9px 0 8px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:1.15rem;line-height:1}
nav.tabs button.on{color:var(--red);font-weight:700}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h2{font-size:.76rem;color:var(--sub);letter-spacing:.12em;margin-bottom:10px;text-transform:uppercase}
/* week/day pickers */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--card);border:1.5px solid var(--line2);color:var(--txt);border-radius:20px;padding:7px 13px;font-size:.8rem;font-family:inherit;white-space:nowrap;position:relative;font-weight:600}
.pill.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.pill.deload{border-style:dashed}
.pill .dot{position:absolute;top:1px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:1.5px solid #fff}
.daypills{display:flex;gap:8px;margin:10px 0 2px}
.daypills .pill{flex:1;text-align:center;padding:9px 0}
/* exercise cards */
.ex{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line2);border-radius:14px;padding:12px 12px 11px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ex.big3{border-left-color:var(--red)}
.ex.done{border-left-color:var(--ok);background:#fbfdfc}
.ex.done .exname{color:var(--sub)}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exname{font-size:1rem;font-weight:800;line-height:1.35}
.excat{font-size:.62rem;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.rx{text-align:right;flex:0 0 auto}
.rx .scheme{font-size:.95rem;font-weight:800}
.rx .rpe{display:inline-block;font-size:.66rem;color:var(--reddeep);font-weight:800;background:var(--redsoft);border-radius:6px;padding:2px 7px;margin-top:3px}
.target{margin-top:8px;background:var(--redsoft);border-radius:9px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.target .lbl{font-size:.66rem;color:var(--reddeep);line-height:1.4}
.target .kg{font-size:1.2rem;font-weight:800;color:var(--red);white-space:nowrap}
.target .kg small{font-size:.68rem;color:var(--sub);font-weight:600}
.memo{margin-top:8px;font-size:.74rem;color:#7a6428;line-height:1.5;background:var(--ambersoft);border-left:3px solid var(--amber);padding:5px 9px;border-radius:0 7px 7px 0}
/* set rows */
.sets{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 1fr 42px;gap:6px;align-items:center}
.setrow.bw{grid-template-columns:24px 1fr 1fr 42px}
.setrow .n{font-size:.72rem;color:var(--sub);text-align:center;font-weight:700}
.setrow input{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:9px;color:var(--txt);font-size:1rem;font-weight:700;font-family:inherit;padding:9px 4px;text-align:center;-moz-appearance:textfield}
.setrow input.auto{color:var(--red);background:var(--redsoft);border-color:#f3c9c9}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none}
.setrow input:focus{outline:none;border-color:var(--red)}
.setrow .chk{width:40px;height:40px;border-radius:10px;background:#fff;border:1.5px solid var(--line2);color:var(--sub);font-size:1.05rem;font-family:inherit}
.setrow .chk.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:800}
.sethead{display:grid;grid-template-columns:24px 1fr 1fr 1fr 42px;gap:6px;font-size:.6rem;color:var(--sub);text-align:center;margin-top:9px;font-weight:700;letter-spacing:.06em}
.sethead.bw{grid-template-columns:24px 1fr 1fr 42px}
.e1line{margin-top:8px;font-size:.72rem;color:var(--sub);display:flex;justify-content:space-between;font-weight:600}
.e1line b{color:var(--ok)}
/* warmup */
.warm{border-left:5px solid var(--amber)}
.warm ul{list-style:none;margin-top:2px}
.warm li{font-size:.82rem;padding:5px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.warm li:last-child{border:none}
.warm li span{color:var(--sub);font-size:.7rem;text-align:right}
/* timer */
#timerbar{position:fixed;bottom:calc(53px + env(safe-area-inset-bottom));left:0;right:0;z-index:29;background:var(--card);border-top:1px solid var(--line);padding:7px 12px;display:flex;align-items:center;gap:8px}
#timerbar .tdisp{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
#timerbar.running .tdisp{color:var(--red)}
#timerbar button{background:var(--bg);border:1.5px solid var(--line2);color:var(--txt);border-radius:9px;padding:7px 10px;font-size:.75rem;font-weight:700;font-family:inherit}
#timerbar button.go{background:var(--red);border-color:var(--red);color:#fff}
#timerbar #tmode{padding:7px 9px;font-size:.95rem;line-height:1}
#timerbar #tmode.sure{background:var(--redsoft);border-color:var(--red)}
/* settings/buttons */
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.field:last-child{border:none}
.field label{font-size:.88rem;font-weight:700}
.field input{width:110px;background:#fff;border:1.5px solid var(--line2);border-radius:9px;color:var(--txt);font-size:1rem;font-weight:700;padding:9px;text-align:center;font-family:inherit}
.field input:focus{outline:none;border-color:var(--red)}
.btn{display:block;width:100%;background:var(--red);border:none;color:#fff;border-radius:11px;padding:13px;font-size:.95rem;font-weight:800;font-family:inherit;margin-top:12px}
.btn.ghost{background:#fff;border:1.5px solid var(--line2);color:var(--txt)}
.btn.danger{background:#fff;border:1.5px solid var(--red);color:var(--red)}
/* charts */
canvas{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.7rem;color:var(--sub);margin-top:6px;flex-wrap:wrap;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* guide */
.guide h3{font-size:.92rem;color:var(--red);margin:16px 0 6px;font-weight:800}
.guide p,.guide li{font-size:.84rem;line-height:1.75}
.guide ul{padding-left:18px;margin:4px 0}
.guide .qa{background:var(--bg);border-radius:9px;padding:9px 11px;margin:8px 0}
.guide .qa b{display:block;font-size:.8rem;margin-bottom:3px}
.guide .qa p{font-size:.78rem;color:var(--sub)}
table.rpet{width:100%;border-collapse:collapse;font-size:.62rem;margin-top:8px}
table.rpet th,table.rpet td{border:1px solid var(--line);padding:3px 2px;text-align:center;font-variant-numeric:tabular-nums}
table.rpet th{background:var(--bg);color:var(--sub)}
table.rpet td.hd{background:var(--redsoft);color:var(--reddeep);font-weight:800}
.note{font-size:.7rem;color:var(--sub);margin-top:8px;line-height:1.6}
.prog{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--red);border-radius:4px}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-size:1.15rem;font-weight:800;color:var(--red)}
.stat .l{font-size:.6rem;color:var(--sub);margin-top:2px;font-weight:700}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;font-weight:700;font-size:.8rem;padding:9px 18px;border-radius:20px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* summary modal */
#smodal{position:fixed;inset:0;z-index:55;background:rgba(20,18,17,.65);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 14px 40px}
#smodal.open{display:flex}
#smodal .box{background:var(--card);border-radius:16px;padding:14px;max-width:440px;width:100%}
#smodal img{width:100%;border-radius:10px;border:1px solid var(--line)}
#smodal .row{display:flex;gap:8px;margin-top:10px}
#smodal .row .btn{margin-top:0}
/* ===== candytune mode ===== */
body.candy{
  --bg:#fff6f9; --card:#ffffff; --line:#ffd9e6; --line2:#ffc2d8;
  --txt:#4a3540; --sub:#b08a9b; --red:#f45f9a; --redsoft:#ffe9f2; --reddeep:#d84280;
  --ok:#3fc99b; --oksoft:#e6faf2; --amber:#f7973f; --ambersoft:#fff3e4; --sub2:#7f5b6d;
  background-image:radial-gradient(#ffe3ee 8%,transparent 9%),radial-gradient(#ffe3ee 8%,transparent 9%);
  background-size:36px 36px;background-position:0 0,18px 18px;
}
body.candy header{border-bottom:5px solid;border-image:linear-gradient(90deg,#e8434a,#f7973f,#7fd8b4,#7cc7ee,#3d6fd8,#a678d8,#f78bc0) 1}
body.candy header h1 span{color:var(--red)}
body.candy .card,body.candy .ex{border-radius:20px}
body.candy .setrow input,body.candy .setrow .chk,body.candy .field input{border-radius:14px}
body.candy .btn{border-radius:18px}
body.candy .prog{height:8px;border-radius:5px}
body.candy .prog i{background:linear-gradient(90deg,#e8434a,#f7973f,#7fd8b4,#7cc7ee,#3d6fd8,#a678d8,#f78bc0)}
body.candy .ex.c0{border-left-color:#e8434a}
body.candy .ex.c1{border-left-color:#3d6fd8}
body.candy .ex.c2{border-left-color:#f78bc0}
body.candy .ex.c3{border-left-color:#7fd8b4}
body.candy .ex.c4{border-left-color:#7cc7ee}
body.candy .ex.c5{border-left-color:#a678d8}
body.candy .ex.c6{border-left-color:#f7973f}
body.candy .ex.done{border-left-color:var(--ok);background:#fdfffd}
body.candy .warm{border-left-color:#f7973f}
body.candy .toast{background:var(--reddeep)}
#themeBtn{position:absolute;top:14px;right:14px;background:var(--redsoft);border:1.5px solid var(--line2);border-radius:18px;padding:6px 12px;font-size:.7rem;font-weight:800;color:var(--reddeep);font-family:inherit}
header{position:relative}
select.pick{width:100%;font-size:1rem;font-weight:800;font-family:inherit;color:var(--txt);background:var(--redsoft) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23888' stroke-width='2' fill='none'/></svg>") no-repeat right 10px center;border:1.5px solid var(--line2);border-radius:10px;padding:7px 30px 7px 10px;-webkit-appearance:none;appearance:none;line-height:1.3}
select.pick:focus{outline:none;border-color:var(--red)}
body.candy select.pick{border-radius:14px}

/* ===== dopagaki mode ===== */
body.dopa{
  --bg:#07030f; --card:#150a24; --line:#33165a; --line2:#4a2280;
  --txt:#f4ecff; --sub:#c0a9e2; --red:#ff2d95; --redsoft:#2a0f3f; --reddeep:#ff6fc0;
  --ok:#16f2e6; --oksoft:#0b2f34; --amber:#ffcf3d; --ambersoft:#2e2408; --sub2:#c0a9e2;
  background-image:repeating-linear-gradient(90deg,rgba(255,45,149,.05) 0 2px,transparent 2px 6px);
}
body.dopa header{background:linear-gradient(180deg,#1a0930,#07030f);border-bottom:3px solid var(--red);box-shadow:0 0 22px rgba(255,45,149,.5)}
body.dopa header h1{text-shadow:0 0 12px rgba(255,45,149,.9)}
body.dopa header h1 span{color:#16f2e6;text-shadow:0 0 14px rgba(22,242,230,.9)}
body.dopa .card,body.dopa .ex{box-shadow:0 0 0 1px rgba(255,45,149,.18),0 6px 22px rgba(0,0,0,.6)}
body.dopa .ex.big3{border-left-color:#ffcf3d}
body.dopa .ex.done{background:#0f2229;border-left-color:#16f2e6;box-shadow:0 0 16px rgba(22,242,230,.3)}
body.dopa .setrow .chk.on{background:#16f2e6;border-color:#16f2e6;color:#04262b;box-shadow:0 0 14px rgba(22,242,230,.8)}
body.dopa .setrow input.auto{color:#ffcf3d;background:#2a2008;border-color:#6b5410}
body.dopa .target{background:#2a0f3f}
body.dopa .target .lbl{color:#ff9fd4}
body.dopa .target .kg{color:#ffcf3d;text-shadow:0 0 10px rgba(255,207,61,.7)}
body.dopa .pill.on{box-shadow:0 0 14px rgba(255,45,149,.8)}
body.dopa .prog i{background:linear-gradient(90deg,#ff2d95,#ffcf3d,#16f2e6)}
body.dopa .memo{color:#ffd98a}
body.dopa nav.tabs{background:#120725;border-top:1px solid #33165a}
body.dopa #timerbar{background:#120725}
body.dopa .btn{box-shadow:0 0 16px rgba(255,45,149,.5)}
body.dopa .toast{background:#ff2d95;color:#fff;box-shadow:0 0 20px rgba(255,45,149,.8)}
/* テーマ選択ボタン */
.thsel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.thbtn{background:var(--bg);border:1.5px solid var(--line2);border-radius:12px;padding:10px 4px;font-size:.68rem;font-weight:700;font-family:inherit;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:4px}
.thbtn b{font-size:1.3rem;line-height:1}
.thbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.dopastat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.dopastat div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.dopastat span{display:block;font-size:.6rem;color:var(--sub)}
.dopastat b{font-size:1rem;color:var(--amber)}
/* 演出オーバーレイ */
#dopa{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;pointer-events:none}
#dopa.on{display:flex}
#dopaflash{position:absolute;inset:0;opacity:0}
#dopabox{position:relative;text-align:center;transform:scale(.7);opacity:0;
  background:radial-gradient(ellipse at center,rgba(7,3,15,.94) 0%,rgba(7,3,15,.86) 62%,rgba(7,3,15,0) 100%);
  padding:34px 30px 40px;border-radius:28px}
#dopabox.in{animation:dpop .22s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes dpop{to{transform:scale(1);opacity:1}}
.dreels{display:flex;gap:10px;justify-content:center}
.dreel{width:82px;height:104px;border-radius:14px;background:linear-gradient(180deg,#1d0b33,#0a0416);
  border:3px solid #ff2d95;box-shadow:0 0 24px rgba(255,45,149,.8),inset 0 0 18px rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;overflow:hidden}
.dreel.stop{border-color:#ffcf3d;box-shadow:0 0 30px rgba(255,207,61,.95)}
.dreel span{display:block;filter:drop-shadow(0 0 8px rgba(255,255,255,.5))}
.dreel.spin span{animation:dspin .09s linear infinite}
@keyframes dspin{0%{transform:translateY(-46px);opacity:.25}50%{opacity:1}100%{transform:translateY(46px);opacity:.25}}
#dopamsg{margin-top:16px;font-size:2.1rem;font-weight:900;letter-spacing:.06em;
  background:linear-gradient(90deg,#ff2d95,#ffcf3d,#16f2e6,#ff2d95);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:dflow 1.1s linear infinite;
  filter:drop-shadow(0 0 12px rgba(255,45,149,.8))}
@keyframes dflow{to{background-position:300% 0}}
#dopapt{margin-top:4px;font-size:1.5rem;font-weight:900;color:#ffcf3d;text-shadow:0 0 14px rgba(255,207,61,.9)}
#dopasub{margin-top:6px;font-size:.85rem;font-weight:800;color:#16f2e6;text-shadow:0 0 10px rgba(22,242,230,.8)}
.dparts{position:absolute;inset:0;overflow:hidden}
.dpart{position:absolute;width:10px;height:10px;border-radius:2px;will-change:transform,opacity}
/* ヘッダーのドパPTバッジ */
#dopahud{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(90deg,#1d0b33,#2a0f3f);border:1.5px solid #ff2d95;border-radius:14px;
  padding:8px 14px;margin-bottom:10px;font-size:.78rem;font-weight:900;color:#ffcf3d;
  box-shadow:0 0 18px rgba(255,45,149,.45);white-space:nowrap}
#dopahud i{font-style:normal;color:#16f2e6}
#dopahud u{text-decoration:none;color:#9b7fc4;font-size:.62rem;font-weight:800;letter-spacing:.08em}
@media(prefers-reduced-motion:reduce){#dopabox.in{animation:none;transform:scale(1);opacity:1}}


/* --- dopa: 可読性の修正 --- */
body.dopa .setrow input,
body.dopa .field input,
body.dopa textarea.cfg{background:#1c0d31;border-color:#4a2280;color:#ffffff}
body.dopa .setrow input:focus,
body.dopa .field input:focus,
body.dopa textarea.cfg:focus{border-color:#16f2e6;box-shadow:0 0 12px rgba(22,242,230,.5)}
body.dopa .setrow input::placeholder,
body.dopa .field input::placeholder,
body.dopa textarea.cfg::placeholder{color:#7b62a3}
body.dopa .setrow .chk{background:#1c0d31;border-color:#4a2280;color:#8f77b8}
body.dopa .btn.ghost{background:#1c0d31;border-color:#4a2280;color:#f4ecff;box-shadow:none}
body.dopa .btn.danger{background:#2a0f22;border-color:#ff2d95;color:#ff8ec4;box-shadow:none}
body.dopa .setrow input.auto{color:#ffe27a;background:#33280a;border-color:#8a6d14}
body.dopa .excat{color:#a98fd0}
body.dopa .sethead{color:#a98fd0}
body.dopa .setrow .n{color:#a98fd0}
body.dopa .note,body.dopa .warm li span,body.dopa .e1line{color:#b9a3dc}
body.dopa .memo{background:#2e2408;border-left-color:#ffcf3d;color:#ffdf9b}
body.dopa .card h2{color:#c9b3ea}
body.dopa .exname{color:#ffffff}
body.dopa .ex.done .exname{color:#8fd9d2}
body.dopa .rx .scheme{color:#ffffff}
body.dopa .rx .rpe{background:#3d1230;color:#ff9fd4}
body.dopa .guide p,body.dopa .guide li{color:#e6dbf7}
body.dopa .guide .qa{background:#1c0d31}
body.dopa .guide .qa p{color:#b9a3dc}
body.dopa table.rpet th{background:#1c0d31;color:#c0a9e2}
body.dopa table.rpet td{color:#e6dbf7}
body.dopa table.rpet td.hd{background:#3d1230;color:#ffcf3d}
body.dopa .psess .pl{color:#b9a3dc}
body.dopa .stat .l,body.dopa .legend{color:#b9a3dc}
body.dopa .vsrow .yo{color:#6fc0ff}
body.dopa select.pick{background-color:#2a0f3f;color:#ffffff;border-color:#4a2280}
body.dopa .pill{color:#f4ecff}
body.dopa .field label{color:#f4ecff}
body.dopa .thbtn{color:#f4ecff}
body.dopa .pill.on{background:#c8006a;border-color:#ff2d95;color:#ffffff}
body.dopa .btn{background:#c8006a;color:#ffffff}
body.dopa .thbtn.on{background:#c8006a;border-color:#ff2d95}
body.dopa #timerbar button.go{background:#c8006a;border-color:#ff2d95}

/* ===== ジムモード ===== */
.gymtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gymhead{flex:1;text-align:center}
.gday{font-size:.7rem;color:var(--sub2);font-weight:800;letter-spacing:.1em}
.gcount{font-size:.95rem;font-weight:900;margin-top:1px}
.gcount span{font-size:.68rem;color:var(--sub2);font-weight:700}
.gnav{width:46px;height:46px;border-radius:50%;background:var(--card);border:1.5px solid var(--line2);
  color:var(--txt);font-size:1.6rem;line-height:1;font-family:inherit;flex:0 0 auto}
.gnav:disabled{opacity:.3}
.gdots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.gdot{width:20px;height:6px;border-radius:3px;background:var(--line);border:none;padding:0}
.gdot.warm{width:12px}
.gdot.fin{background:var(--ok)}
.gdot.on{background:var(--red);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--red)}
.gundo{display:block;width:100%;background:var(--ambersoft);border:1.5px solid var(--amber);color:var(--amber);
  border-radius:12px;padding:10px;font-size:.82rem;font-weight:800;font-family:inherit;margin-bottom:10px}
.gcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);
  border-radius:16px;padding:16px 14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.gcard.warmcard{border-left-color:var(--amber)}
.gcard.warmcard.fin{border-left-color:var(--ok)}
.gtag{font-size:.64rem;color:var(--sub2);letter-spacing:.1em;font-weight:800;text-transform:uppercase}
.gname{font-size:1.7rem;font-weight:900;line-height:1.25;margin-top:4px}
select.gpick{font-size:1.45rem;font-weight:900;margin-top:6px;padding:10px 34px 10px 12px}
.gscheme{font-size:1rem;font-weight:800;color:var(--sub2);margin-top:6px}
.gscheme b{color:var(--red)}
.gtarget{margin-top:12px;background:var(--redsoft);border-radius:12px;padding:11px 13px;display:flex;
  align-items:baseline;gap:9px;flex-wrap:wrap}
.gtarget span{font-size:.7rem;color:var(--reddeep);font-weight:800}
.gtarget b{font-size:2rem;font-weight:900;color:var(--red);line-height:1}
.gtarget b small{font-size:.8rem;margin-left:2px}
.gtarget i{flex:0 0 100%;font-size:.68rem;color:var(--sub2);font-style:normal}
.gsets{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.gset{display:grid;grid-template-columns:22px 1fr 1fr 1fr 56px;gap:7px;align-items:center;
  padding:5px;border-radius:12px}
.gset.next{background:var(--redsoft);box-shadow:inset 0 0 0 1.5px var(--red)}
.gset.done{opacity:.55}
.gset .gn{font-size:.78rem;font-weight:900;color:var(--sub2);text-align:center}
.gset input{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:11px;color:var(--txt);
  font-size:1.15rem;font-weight:800;font-family:inherit;padding:12px 4px;text-align:center;-moz-appearance:textfield}
.gset input.auto{color:var(--red);background:var(--redsoft);border-color:var(--line2)}
.gset input::-webkit-outer-spin-button,.gset input::-webkit-inner-spin-button{-webkit-appearance:none}
.gset input:focus{outline:none;border-color:var(--red)}
.gchk{width:56px;height:50px;border-radius:12px;background:#fff;border:2px solid var(--line2);
  color:var(--sub2);font-size:1.4rem;font-family:inherit;font-weight:900}
.gchk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.gset.next .gchk{border-color:var(--red);color:var(--red)}
.grest{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--bg);border-radius:12px;padding:9px 11px}
.grest span{font-size:.74rem;font-weight:800;color:var(--sub2)}
.grest b{font-size:1.15rem;font-weight:900;min-width:56px;text-align:center}
.grest button{background:var(--card);border:1.5px solid var(--line2);color:var(--txt);border-radius:9px;
  padding:7px 11px;font-size:.78rem;font-weight:800;font-family:inherit}
.grest i{flex:0 0 100%;font-size:.66rem;color:var(--sub2);font-style:normal}
.gbig{display:block;width:100%;background:var(--red);border:none;color:#fff;border-radius:14px;
  padding:17px;font-size:1.05rem;font-weight:900;font-family:inherit;margin-top:14px}
.gbig.done{background:var(--ok)}
.gbig.ghostbig{background:var(--card);border:1.5px solid var(--line2);color:var(--sub2)}
body.dopa .gset input{background:#1c0d31;border-color:#4a2280;color:#fff}
body.dopa .gset input.auto{color:#ffe27a;background:#33280a;border-color:#8a6d14}
body.dopa .gchk{background:#1c0d31;border-color:#4a2280;color:#8f77b8}
body.dopa .gchk.on{background:#16f2e6;border-color:#16f2e6;color:#04262b}
body.dopa .gbig{background:#c8006a}
body.dopa .gbig.ghostbig{background:#1c0d31;color:#b9a3dc}
body.dopa .gtarget b{color:#ffcf3d}
body.dopa .gtarget span{color:#ff9fd4}
body.candy .gcard,body.candy .gbig{border-radius:22px}
body.candy .gtarget span{color:#c2306f}
body.candy .gtarget b{color:#d31f68}
body.candy .gscheme b{color:#d31f68}

/* ===== candy: ふわふわ演出 ===== */
#cparts{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.cpart{position:absolute;font-weight:900;will-change:transform,opacity;line-height:1;
  filter:drop-shadow(0 2px 4px rgba(244,95,154,.35))}
#cribbon{position:fixed;left:50%;top:78px;transform:translate(-50%,-14px);z-index:61;pointer-events:none;
  background:linear-gradient(90deg,#ff8ec2,#f45f9a);color:#fff;font-size:.86rem;font-weight:900;
  padding:11px 22px;border-radius:22px;box-shadow:0 6px 20px rgba(244,95,154,.45);opacity:0;
  transition:opacity .25s,transform .25s;white-space:nowrap}
#cribbon.show{opacity:1;transform:translate(-50%,0)}
#ccheer{background:linear-gradient(90deg,#fff0f6,#f6ecff);border:1.5px dashed #f9a8cd;border-radius:16px;
  padding:11px 14px;margin-bottom:10px;font-size:.88rem;font-weight:900;color:#c2306f;text-align:center;
  box-shadow:0 2px 8px rgba(244,95,154,.10)}
body.candy .setrow .chk.on,body.candy .gchk.on{animation:cbounce .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes cbounce{0%{transform:scale(1)}35%{transform:scale(1.28)}70%{transform:scale(.92)}100%{transform:scale(1)}}
body.candy .ex.done{position:relative}
body.candy .ex.done::after{content:'🎀';position:absolute;top:-7px;right:10px;font-size:1.15rem;
  filter:drop-shadow(0 2px 3px rgba(244,95,154,.4))}
@media(prefers-reduced-motion:reduce){.cpart{display:none}body.candy .setrow .chk.on{animation:none}}

/* ===== インストール案内 ===== */
#installBox{display:none;background:var(--card);border:2px solid var(--red);border-radius:16px;
  padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
#installBox.show{display:block}
#installBox h3{font-size:.92rem;font-weight:900;margin-bottom:4px}
#installBox p{font-size:.76rem;color:var(--sub2);line-height:1.7}
#installBox .ibtn{display:block;width:100%;background:var(--red);border:none;color:#fff;border-radius:12px;
  padding:13px;font-size:.92rem;font-weight:900;font-family:inherit;margin-top:10px}
#installBox .ilater{display:block;width:100%;background:none;border:none;color:var(--sub2);
  font-size:.74rem;font-family:inherit;padding:9px;margin-top:2px}
#installBox ol{padding-left:20px;margin-top:6px}
#installBox li{font-size:.78rem;line-height:1.9}
#installBox b{color:var(--red)}
/* partner / sync */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;border-radius:14px;padding:4px 11px}
.sync .d{width:8px;height:8px;border-radius:50%}
.sync.on{background:var(--oksoft);color:var(--ok)} .sync.on .d{background:var(--ok)}
.sync.off{background:var(--bg);color:var(--sub)} .sync.off .d{background:var(--sub)}
.sync.err{background:var(--redsoft);color:var(--reddeep)} .sync.err .d{background:var(--red)}
.psess{border-top:1px dashed var(--line);padding:8px 0}
.psess:first-of-type{border-top:none}
.psess .pt{font-size:.8rem;font-weight:800}
.psess .pl{font-size:.74rem;color:var(--sub);line-height:1.7}
textarea.cfg{width:100%;min-height:96px;background:#fff;border:1.5px solid var(--line2);border-radius:10px;font-size:.72rem;font-family:ui-monospace,monospace;padding:9px;color:var(--txt)}
textarea.cfg:focus{outline:none;border-color:var(--red)}
.steps{font-size:.76rem;line-height:1.8;color:var(--txt);padding-left:18px;margin-top:6px}
.steps li{margin-bottom:4px}
details.setup summary{font-size:.8rem;font-weight:800;color:var(--red);cursor:pointer;padding:4px 0}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vsrow:last-child{border:none}
.vsrow .me{text-align:right;font-weight:800;font-size:1.05rem;color:var(--red)}
.vsrow .yo{text-align:left;font-weight:800;font-size:1.05rem;color:#2f6fd6}
.vsrow .lift{font-size:.66rem;color:var(--sub);font-weight:800;text-align:center;letter-spacing:.08em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s){ if(!s.theme) s.theme='std'; if(!s.picks) s.picks={}; if(!s.sound) s.sound='mix'; if(!s.imgRatio) s.imgRatio='4:5'; if(s.dopaPT==null) s.dopaPT=0; if(s.dopaMaxCombo==null) s.dopaMaxCombo=0; if(s.dopa777==null) s.dopa777=0; if(s.gym==null) s.gym=false; if(!s.rest) s.rest={}; if(!s.candyImg) s.candyImg='list'; if(s.candyFx==null) s.candyFx=true; if(s.candySound==null) s.candySound=true; return s; } }catch(e){}
  return { oneRM:{sq:null,bp:null,dl:null}, logs:{}, picks:{}, wk:0, dy:0, theme:'std', sound:'mix', imgRatio:'4:5', dopaPT:0, dopaMaxCombo:0, dopa777:0, gym:false, rest:{}, candyImg:'list', candyFx:true, candySound:true };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); schedulePush(); }

/* ========== Firebase sync ========== */
const FBKEY='squatmania_fb1';
let FB = (()=>{ try{ return JSON.parse(localStorage.getItem(FBKEY))||{config:null,name:''}; }catch(e){ return {config:null,name:''}; } })();
function saveFB(){ localStorage.setItem(FBKEY, JSON.stringify(FB)); }
let FBSTATE='off'; // off | connecting | on | err
let FBERR='';
let REMOTE={};     // {userKey:{name,oneRM,logs,updatedAt}}
let fbdb=null;
let pushTimer=null;
function myKey(){ return (FB.name||'').trim().replace(/[.#$\[\]\/\s]/g,'_'); }

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

async function connectFB(){
  if(!FB.config || !myKey()){ FBSTATE='off'; syncUI(); return; }
  FBSTATE='connecting'; FBERR=''; syncUI();
  try{
    if(!window.firebase){
      const v='10.12.2';
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-database-compat.js`);
    }
    if(!firebase.apps.length) firebase.initializeApp(FB.config);
    try{ await firebase.auth().signInAnonymously(); }catch(e){ /* 匿名認証が無効ならテストモードルールで続行 */ }
    fbdb=firebase.database();
    fbdb.ref('users').on('value', snap=>{
      REMOTE = snap.val()||{};
      FBSTATE='on'; syncUI();
      // 初回：この端末が空でクラウドに自分のデータがあれば復元
      const mine=REMOTE[myKey()];
      if(mine && Object.keys(S.logs).length===0 && mine.logs && Object.keys(mine.logs).length>0){
        S.logs=mine.logs; S.oneRM=mine.oneRM||S.oneRM; S.picks=mine.picks||S.picks;
        localStorage.setItem(KEY, JSON.stringify(S));
        toast('クラウドから記録を復元しました');
      }
      if(tab==='partner') render();
    }, err=>{ FBSTATE='err'; FBERR=err.message||'接続エラー'; syncUI(); });
    schedulePush(0);
  }catch(e){
    FBSTATE='err'; FBERR=e.message||'初期化エラー'; syncUI();
  }
}
function schedulePush(delay=800){
  if(!fbdb || !myKey()) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{
    fbdb.ref('users/'+myKey()).set({
      name:FB.name.trim(), oneRM:S.oneRM, logs:S.logs, picks:S.picks||{}, updatedAt:Date.now()
    }).catch(e=>{ FBSTATE='err'; FBERR=e.message||'書込エラー'; syncUI(); });
  }, delay);
}
function partner(){
  const me=myKey();
  let best=null;
  Object.entries(REMOTE).forEach(([k,v])=>{
    if(k===me||!v) return;
    if(!best || (v.updatedAt||0)>(best.updatedAt||0)) best=v;
  });
  return best;
}
function syncUI(){
  const el=document.getElementById('syncchip');
  if(el){
    el.className='sync '+(FBSTATE==='on'?'on':FBSTATE==='err'?'err':'off');
    el.innerHTML='<span class="d"></span>'+(FBSTATE==='on'?'同期中':FBSTATE==='connecting'?'接続中…':FBSTATE==='err'?'エラー':'未接続');
  }
}

let recMap={}; // logKey -> recommended kg (runtime)

/* ---------- helpers ---------- */
const MAIN = {'スクワット':'sq','ベンチプレス':'bp','デッドリフト':'dl'};
const CATRM = {sq:'sq',bp:'bp',dl:'dl'};
const CATNAME = {sq:'SQUAT系',bp:'BENCH系',dl:'DEADLIFT系',leg:'脚',pull:'背中(プル)',row:'ロウ',shoulder:'肩',arm:'腕'};
function isBW(name){ return String(name).includes('アブローラー'); } // 自重種目：kg欄なし
function effName(w,d,i){
  const ex=PROGRAM[w].days[d].exercises[i];
  const p=S.picks&&S.picks[logKey(w,d,i)];
  return (p && (!ex.opts || ex.opts.includes(p))) ? p : ex.name;
}
function pct(rpe,reps){
  if(rpe==null||!reps||reps==='amrap') return null;
  let r = Number(rpe); if(r<6) return null; if(r>10) r=10;
  const key = (Math.round(r*2)/2).toFixed(1);
  const row = CHART[key]; if(!row) return null;
  const i = Math.min(Math.max(1,Math.round(reps)),15)-1;
  return row[i]||null;
}
function e1rm(kg,reps,rpe){
  const p = pct(rpe,reps);
  if(!p||!kg) return null;
  return kg/p;
}
function round25(v){ return Math.round(v/2.5)*2.5; }
function logKey(w,d,i){ return w+'|'+d+'|'+i; }
function getLog(w,d,i,ex){
  const k = logKey(w,d,i);
  if(!S.logs[k]){
    const n = (typeof ex.set==='number'&&ex.set>0)?ex.set:1;
    S.logs[k]={date:null,sets:Array.from({length:n},()=>({kg:'',reps:'',rpe:'',done:false}))};
  }
  return S.logs[k];
}
function fmtKg(v){ return (Math.round(v*2)/2).toLocaleString(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1700); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* 同じ種目名（選択後の名称）の直近セッションのベスト実績を取得 */
function lastRecordFor(name, exceptKey){
  let bestE1=null, lastKg=null, bestDate='';
  PROGRAM.forEach((wk,w)=>wk.days.forEach((day,d)=>day.exercises.forEach((ex,i)=>{
    const k=logKey(w,d,i);
    if(k===exceptKey) return;
    if(effName(w,d,i)!==name) return;
    const L=S.logs[k]; if(!L||!L.date) return;
    let sessE1=null, sessKg=null;
    L.sets.forEach(s=>{
      if(!s.done) return;
      const kg=Number(s.kg);
      if(kg && (!sessKg||kg>sessKg)) sessKg=kg;
      const e=e1rm(kg,Number(s.reps),Number(s.rpe));
      if(e&&(!sessE1||e>sessE1)) sessE1=e;
    });
    if((sessE1||sessKg) && L.date>=bestDate){ bestDate=L.date; bestE1=sessE1; lastKg=sessKg; }
  })));
  return (bestE1||lastKg)?{e1:bestE1,kg:lastKg,date:bestDate}:null;
}
/* 推奨重量：前回実績E1RM優先 → 前回重量 → BIG3は設定1RM */
function recommendKg(name, ex, exceptKey){
  if(isBW(name)) return null;
  if(!(ex.rpe>0) || !ex.rep || ex.rep==='amrap') return null;
  const p=pct(ex.rpe,ex.rep); if(!p) return null;
  const hist=lastRecordFor(name, exceptKey);
  if(hist && hist.e1) return {kg:round25(hist.e1*p), basis:'前回実績E1RM '+fmtKg(hist.e1)+'kg × '+(p*100).toFixed(1)+'%', src:'hist'};
  if(hist && hist.kg) return {kg:round25(hist.kg), basis:'前回の重量 '+fmtKg(hist.kg)+'kg（RPE未記録のため据え置き）', src:'lastkg'};
  const isSameAsProgram = (name===ex.name);
  if(isSameAsProgram && CATRM[ex.cat] && S.oneRM[CATRM[ex.cat]]){
    const rm=S.oneRM[CATRM[ex.cat]];
    const isMainLift = MAIN[ex.name]===ex.cat;
    return {kg:round25(rm*p), basis:'1RM '+fmtKg(rm)+'kg × '+(p*100).toFixed(1)+'%'+(isMainLift?'':'（バリエーション目安）'), src:isMainLift?'rm':'rmvar'};
  }
  return null;
}

/* ----- train ----- */
function dayDone(w,d){
  const day = PROGRAM[w].days[d]; if(!day) return false;
  return day.exercises.length>0 && day.exercises.every((ex,i)=>{
    const L=S.logs[logKey(w,d,i)];
    return L && L.sets.every(s=>s.done);
  });
}
function weekProgress(w){
  const days=PROGRAM[w].days;
  return days.filter((_,d)=>dayDone(w,d)).length/days.length;
}
function renderTrain(){
  recMap={};
  const w=S.wk, d=Math.min(S.dy, PROGRAM[w].days.length-1);
  const week=PROGRAM[w];
  let h='';
  h+='<div class="pills">'+PROGRAM.map((wk,i)=>{
    const dl=wk.name.includes('deload');
    const full=weekProgress(i)>=1;
    return `<button class="pill${i===w?' on':''}${dl?' deload':''}" onclick="pickWeek(${i})">${esc(wk.name)}${full?'<span class="dot"></span>':''}</button>`;
  }).join('')+'</div>';
  h+='<div class="daypills">'+week.days.map((dd,i)=>{
    const full=dayDone(w,i);
    return `<button class="pill${i===d?' on':''}" onclick="pickDay(${i})">${esc(dd.day)}${full?'<span class="dot"></span>':''}</button>`;
  }).join('')+'</div>';
  const wp=weekProgress(w);
  h+=`<div class="prog"><i style="width:${Math.round(wp*100)}%"></i></div>`;
  h+='<div class="card warm" style="margin-top:12px"><h2>ウォームアップ</h2><ul>'+
    week.warmup.map(x=>`<li><span style="color:var(--txt);font-size:.82rem;text-align:left">${esc(x.name)}　<b>${x.sets}×${x.reps}</b></span><span>${esc(x.memo)}</span></li>`).join('')+
    '</ul></div>';
  const day=week.days[d];
  day.exercises.forEach((ex,i)=>{ h+=renderEx(w,d,i,ex); });
  // summary image button (any done set today)
  const anyDone = day.exercises.some((ex,i)=>{ const L=S.logs[logKey(w,d,i)]; return L&&L.sets.some(s=>s.done); });
  h+=`<button class="btn" ${anyDone?'':'disabled style="opacity:.4"'} onclick="makeSummary(${w},${d})">📸 今日のまとめ画像を作成</button>`;
  return h;
}

/* ========== ジムモード（1種目フォーカス） ========== */
const REST_DEFAULT={sq:180,bp:180,dl:180,leg:120,pull:90,row:90,shoulder:90,arm:60,'':90};
function restSec(w,d,i){
  const ex=PROGRAM[w].days[d].exercises[i];
  const nm=effName(w,d,i);
  if(S.rest[nm]!=null) return S.rest[nm];
  const isMain = MAIN[ex.name]===ex.cat && nm===ex.name;
  if(isMain) return 180;
  return REST_DEFAULT[ex.cat] ?? 90;
}
function setRest(w,d,i,sec){
  const nm=effName(w,d,i);
  S.rest[nm]=Math.max(15,Math.min(600,Number(sec)||90));
  save(); render();
}
/* フォーカス位置：未完了の先頭（ウォームアップ→種目） */
let gymIdx=null;       // {type:'warm'|'ex', n}
function gymSteps(w,d){
  const steps=[];
  PROGRAM[w].warmup.forEach((x,n)=>steps.push({type:'warm',n}));
  PROGRAM[w].days[d].exercises.forEach((ex,n)=>steps.push({type:'ex',n}));
  return steps;
}
function gymDoneStep(w,d,st){
  if(st.type==='warm') return !!(S.warmDone && S.warmDone[w+'|'+d+'|'+st.n]);
  const L=S.logs[logKey(w,d,st.n)];
  return !!(L && L.sets.length && L.sets.every(s=>s.done));
}
function gymAutoIdx(w,d){
  const steps=gymSteps(w,d);
  const i=steps.findIndex(st=>!gymDoneStep(w,d,st));
  return i<0 ? steps.length-1 : i;
}
function gymCur(w,d){
  const steps=gymSteps(w,d);
  if(gymIdx==null || gymIdx>=steps.length) gymIdx=gymAutoIdx(w,d);
  return Math.max(0,Math.min(steps.length-1,gymIdx));
}
function gymGo(delta){
  const w=S.wk,d=Math.min(S.dy,PROGRAM[S.wk].days.length-1);
  const steps=gymSteps(w,d);
  gymIdx=Math.max(0,Math.min(steps.length-1, gymCur(w,d)+delta));
  gymUndo=null;
  render(); window.scrollTo(0,0);
}
function gymJump(n){ gymIdx=n; gymUndo=null; render(); window.scrollTo(0,0); }
function warmToggle(w,d,n){
  if(!S.warmDone) S.warmDone={};
  const k=w+'|'+d+'|'+n;
  S.warmDone[k]=!S.warmDone[k];
  save();
  if(S.warmDone[k]) gymAdvance(w,d);
  else render();
}
let gymUndo=null, gymUndoTimer=null;
function gymAdvance(w,d){
  const steps=gymSteps(w,d);
  const cur=gymCur(w,d);
  if(cur>=steps.length-1){ render(); return; }
  gymUndo=cur;
  gymIdx=cur+1;
  render(); window.scrollTo(0,0);
  clearTimeout(gymUndoTimer);
  gymUndoTimer=setTimeout(()=>{ gymUndo=null; if(S.gym) render(); }, 8000);
}
function gymBack(){ if(gymUndo!=null){ gymIdx=gymUndo; gymUndo=null; clearTimeout(gymUndoTimer); render(); } }
function renderGym(){
  recMap={};
  const w=S.wk, d=Math.min(S.dy, PROGRAM[w].days.length-1);
  const week=PROGRAM[w], day=week.days[d];
  const steps=gymSteps(w,d);
  const cur=gymCur(w,d);
  const st=steps[cur];
  const doneCount=steps.filter(x=>gymDoneStep(w,d,x)).length;

  let h=`<div class="gymtop">
    <button class="gnav" ${cur<=0?'disabled':''} onclick="gymGo(-1)">‹</button>
    <div class="gymhead">
      <div class="gday">${esc(week.name)} ${esc(day.day.toUpperCase())}</div>
      <div class="gcount">${cur+1} / ${steps.length}　<span>完了 ${doneCount}</span></div>
    </div>
    <button class="gnav" ${cur>=steps.length-1?'disabled':''} onclick="gymGo(1)">›</button>
  </div>
  <div class="gdots">${steps.map((x,n)=>`<button class="gdot${n===cur?' on':''}${gymDoneStep(w,d,x)?' fin':''}${x.type==='warm'?' warm':''}" onclick="gymJump(${n})"></button>`).join('')}</div>`;

  if(gymUndo!=null) h+=`<button class="gundo" onclick="gymBack()">↩ 前の種目に戻る</button>`;

  if(st.type==='warm'){
    const x=week.warmup[st.n];
    const fin=gymDoneStep(w,d,st);
    h+=`<div class="gcard warmcard${fin?' fin':''}">
      <div class="gtag">ウォームアップ ${st.n+1}/${week.warmup.length}</div>
      <div class="gname">${esc(x.name)}</div>
      <div class="gscheme">${x.sets} × ${x.reps}</div>
      ${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}
      <button class="gbig${fin?' done':''}" onclick="warmToggle(${w},${d},${st.n})">${fin?'✓ 完了（タップで戻す）':'完了して次へ'}</button>
    </div>`;
    return h;
  }

  const i=st.n, ex=day.exercises[i];
  const L=getLog(w,d,i,ex), k=logKey(w,d,i);
  const nm=effName(w,d,i), bw=isBW(nm);
  const rec=recommendKg(nm,ex,k);
  if(rec) recMap[k]=rec.kg;
  const rsec=restSec(w,d,i);
  const nextUndone=L.sets.findIndex(s=>!s.done);

  h+=`<div class="gcard">
    <div class="gtag">${CATNAME[ex.cat]||(bw?'自重':'補助')}${ex.opts?' ・種目を選択できます':''}</div>`;
  h+= ex.opts
    ? `<select class="pick gpick" onchange="pickEx(${w},${d},${i},this.value)">`+ex.opts.map(o=>`<option value="${esc(o)}"${o===nm?' selected':''}>${esc(o)}</option>`).join('')+`</select>`
    : `<div class="gname">${esc(nm)}</div>`;
  h+=`<div class="gscheme">${ex.rep==='amrap'?'AMRAP':ex.rep??'—'} reps × ${ex.set||1} set${ex.rpe>0?`　<b>RPE ${ex.rpe}</b>`:''}</div>`;
  if(ex.memo) h+=`<div class="memo">${esc(ex.memo)}</div>`;
  if(rec) h+=`<div class="gtarget"><span>推奨重量</span><b>${rec.src==='rmvar'?'~':''}${fmtKg(rec.kg)}<small>kg</small></b><i>${esc(rec.basis)}</i></div>`;

  h+=`<div class="gsets">`;
  L.sets.forEach((s,si)=>{
    const isNext = si===nextUndone;
    const autoKg=(!bw && s.kg==='' && rec)?rec.kg:null;
    h+=`<div class="gset${s.done?' done':''}${isNext?' next':''}">
      <span class="gn">${si+1}</span>
      ${bw?'':`<input type="number" inputmode="decimal" step="0.5" class="${autoKg!=null?'auto':''}" placeholder="kg" value="${autoKg!=null?autoKg:s.kg}" onchange="upSet(${w},${d},${i},${si},'kg',this.value)">`}
      <input type="number" inputmode="numeric" placeholder="${ex.rep==='amrap'?'max':ex.rep??''}" value="${s.reps}" onchange="upSet(${w},${d},${i},${si},'reps',this.value)">
      <input type="number" inputmode="decimal" step="0.5" placeholder="${ex.rpe>0?ex.rpe:''}" value="${s.rpe}" onchange="upSet(${w},${d},${i},${si},'rpe',this.value)">
      <button class="gchk${s.done?' on':''}" onclick="gymTick(${w},${d},${i},${si})">${s.done?'✓':''}</button>
    </div>`;
  });
  h+=`</div>`;

  let e1best=null;
  L.sets.forEach(s=>{ const e=e1rm(Number(s.kg),Number(s.reps),Number(s.rpe)); if(e&&(!e1best||e>e1best)) e1best=e; });
  if(e1best) h+=`<div class="e1line"><span>このセッションのE1RM</span><b>${fmtKg(e1best)} kg</b></div>`;

  h+=`<div class="grest">
      <span>レスト</span>
      <button onclick="setRest(${w},${d},${i},${Math.max(15,rsec-30)})">−30</button>
      <b>${Math.floor(rsec/60)}:${String(rsec%60).padStart(2,'0')}</b>
      <button onclick="setRest(${w},${d},${i},${rsec+30})">+30</button>
      <i>✓で自動スタート</i>
    </div>`;
  h+=`</div>`;

  const allDone=L.sets.every(s=>s.done);
  h+=`<button class="gbig ${allDone?'':'ghostbig'}" onclick="gymAdvance(${w},${d})">${cur>=steps.length-1?'最後の種目です':'次の種目へ →'}</button>`;
  const anyDone = day.exercises.some((e2,n)=>{ const LL=S.logs[logKey(w,d,n)]; return LL&&LL.sets.some(s=>s.done); });
  if(anyDone) h+=`<button class="btn ghost" onclick="makeSummary(${w},${d})">📸 今日のまとめ画像を作成</button>`;
  h+=`<button class="btn ghost" onclick="setGym(false)">📋 一覧表示に戻す</button>`;
  return h;
}
function gymTick(w,d,i,si){
  const ex=PROGRAM[w].days[d].exercises[i];
  const L=getLog(w,d,i,ex);
  const wasDone=L.sets[si].done;
  tickSet(w,d,i,si);
  if(!wasDone && L.sets[si].done){
    // レストタイマー自動スタート

function renderEx(w,d,i,ex){
  const L=getLog(w,d,i,ex);
  const k=logKey(w,d,i);
  const nm=effName(w,d,i);
  const bw=isBW(nm);
  const isBig = !!CATRM[ex.cat];
  const allDone=L.sets.length>0&&L.sets.every(s=>s.done);
  const repTxt = ex.rep==='amrap' ? 'AMRAP' : ex.rep;
  const scheme = (ex.rep!=null?repTxt:'—')+(ex.set?` × ${ex.set}set`:'');
  const rec = recommendKg(nm, ex, k);
  if(rec) recMap[k]=rec.kg;
  let target='';
  if(rec){
    target=`<div class="target"><span class="lbl">推奨重量｜${esc(rec.basis)}</span><span class="kg">${rec.src==='rmvar'?'~':''}${fmtKg(rec.kg)}<small> kg</small></span></div>`;
  }else if(!bw && isBig && ex.rpe>0 && ex.rep && ex.rep!=='amrap'){
    target=`<div class="target"><span class="lbl">設定タブで1RMを入力すると推奨重量を自動計算します</span></div>`;
  }else if(!bw && ex.rpe>0 && ex.rep && ex.rep!=='amrap'){
    target=`<div class="target"><span class="lbl">初回のみ自分でkgを入力してください。次回から前回実績をもとに自動計算します</span></div>`;
  }
  let e1best=null;
  L.sets.forEach(s=>{ const e=e1rm(Number(s.kg),Number(s.reps),Number(s.rpe)); if(e&&(!e1best||e>e1best)) e1best=e; });
  const nameCell = ex.opts
    ? `<select class="pick" onchange="pickEx(${w},${d},${i},this.value)">`+ex.opts.map(o=>`<option value="${esc(o)}"${o===nm?' selected':''}>${esc(o)}</option>`).join('')+`</select>`
    : `<div class="exname">${esc(nm)}</div>`;
  let h=`<div class="ex c${i%7}${isBig?' big3':''}${allDone?' done':''}">
    <div class="exhead">
      <div style="min-width:0;flex:1">${nameCell}<div class="excat">${CATNAME[ex.cat]||(bw?'自重':'補助')}${ex.opts?'　･種目を選択できます':''}</div></div>
      <div class="rx"><div class="scheme">${scheme}</div>${ex.rpe>0?`<div class="rpe">RPE ${ex.rpe}</div>`:''}</div>
    </div>`;
  if(ex.memo) h+=`<div class="memo">${esc(ex.memo)}</div>`;
  h+=target;
  h+=`<div class="sethead${bw?' bw':''}"><span></span>${bw?'':'<span>kg</span>'}<span>rep</span><span>RPE</span><span>✓</span></div><div class="sets">`;
  L.sets.forEach((s,si)=>{
    const autoKg = (!bw && s.kg==='' && rec) ? rec.kg : null;
    h+=`<div class="setrow${bw?' bw':''}">
      <span class="n">${si+1}</span>`;
    if(!bw){
      h+=`<input type="number" inputmode="decimal" step="0.5" class="${autoKg!=null?'auto':''}" placeholder="kg" value="${autoKg!=null?autoKg:s.kg}" onchange="upSet(${w},${d},${i},${si},'kg',this.value)">`;
    }
    h+=`<input type="number" inputmode="numeric" placeholder="${ex.rep==='amrap'?'max':ex.rep??''}" value="${s.reps}" onchange="upSet(${w},${d},${i},${si},'reps',this.value)">
      <input type="number" inputmode="decimal" step="0.5" placeholder="${ex.rpe>0?ex.rpe:''}" value="${s.rpe}" onchange="upSet(${w},${d},${i},${si},'rpe',this.value)">
      <button class="chk${s.done?' on':''}" onclick="tickSet(${w},${d},${i},${si})">${s.done?'✓':''}</button>
    </div>`;
  });
  h+='</div>';
  if(e1best) h+=`<div class="e1line"><span>このセッションのE1RM</span><b>${fmtKg(e1best)} kg</b></div>`;
  h+='</div>';

function makeSummary(w,d){
  const day=PROGRAM[w].days[d];
  const wkName=PROGRAM[w].name;
  // collect done exercises
  const items=[];
  let totalVol=0;
  day.exercises.forEach((ex,i)=>{
    const L=S.logs[logKey(w,d,i)]; if(!L) return;
    const done=L.sets.filter(s=>s.done);
    if(!done.length) return;
    const nm=effName(w,d,i);
    const bw=isBW(nm);
    let vol=0, topKg=0, reps=0;
    const parts=done.map(s=>{
      const kg=(!bw && s.kg!=='')?Number(s.kg):null, rp=s.reps!==''?s.reps:'';
      if(kg&&rp){ totalVol+=kg*Number(rp); vol+=kg*Number(rp); }
      if(kg&&kg>topKg) topKg=kg;
      if(rp) reps+=Number(rp);
      if(bw||!kg) return `×${rp||'—'}`;
      return `${fmtKg(kg)}×${rp||'—'}`;
    });
    items.push({name:nm, parts, rpe:ex.rpe, vol, topKg, reps, sets:done.length});
  });
  if(!items.length){ toast('完了したセットがありません'); return; }

  const cv=document.createElement('canvas'); cv.width=1080; cv.height=(S.imgRatio==='1:1'?1080:1350);
  const now=new Date();
  const youbi=['日','月','火','水','木','金','土'][now.getDay()];
  const dateStr=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  if(S.theme==='candy') (S.candyImg==='cheki'?drawSummaryCheki:drawSummaryCandy)(cv,items,totalVol,dateStr,youbi,wkName,day.day);
  else if(S.theme==='dopa') drawSummaryDopa(cv,items,totalVol,dateStr,youbi,wkName,day.day);
  else drawSummaryStd(cv,items,totalVol,dateStr,youbi,wkName,day.day);
  const url=cv.toDataURL('image/png');
  document.getElementById('simg').src=url;
  const a=document.getElementById('sdl');
  a.href=url;
  a.download=`workout_${dateStr.replace(/\./g,'')}_${day.day}.png`;
  document.getElementById('smodal').classList.add('open');
}

/* ===== 重量のかわいい換算 ===== */
const CUTE_UNITS=[
  {e:'🍬',n:'キャンディ',u:'個',w:0.005},
  {e:'🍩',n:'ドーナツ',u:'個',w:0.06},
  {e:'🍰',n:'ショートケーキ',u:'切れ',w:0.13},
  {e:'🧸',n:'テディベア',u:'体',w:0.6},
  {e:'🎂',n:'ホールケーキ',u:'台',w:1.2},
  {e:'🐰',n:'うさぎ',u:'羽',w:1.8},
  {e:'🐱',n:'ねこ',u:'匹',w:4.2},
  {e:'🐧',n:'ペンギン',u:'羽',w:12},
  {e:'🐑',n:'ひつじ',u:'頭',w:60},
  {e:'🐼',n:'パンダ',u:'頭',w:110},
  {e:'🎹',n:'グランドピアノ',u:'台',w:320},
  {e:'🐘',n:'ぞう',u:'頭',w:4000}
];
function cuteCount(kg,unit){
  const c=kg/unit.w;
  const v=c>=100?Math.round(c):Math.round(c*10)/10;
  return v.toLocaleString();
}
function cuteText(kg,unit){ return `${unit.e} ${unit.n} ${cuteCount(kg,unit)}${unit.u}`; }
/* 数が読みやすい単位を選ぶ（2〜200を優先、大きいものから） */
function pickCute(kg){
  for(let i=CUTE_UNITS.length-1;i>=0;i--){
    const c=kg/CUTE_UNITS[i].w;
    if(c>=2 && c<=200) return CUTE_UNITS[i];
  }
  for(let i=CUTE_UNITS.length-1;i>=0;i--){
    if(kg/CUTE_UNITS[i].w>=1) return CUTE_UNITS[i];
  }
  return CUTE_UNITS[0];
}
function cuteLines(kg){
  const candy=CUTE_UNITS[0];
  const pick=pickCute(kg);
  const out=[cuteText(kg,candy)];
  if(pick!==candy) out.push(cuteText(kg,pick));
  return out;
}

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

function sessionsOf(logs,picks){
  // date -> [{week,day,items:[{name,parts,rpe}]}]
  const byDate={};
  PROGRAM.forEach((wk,w)=>wk.days.forEach((day,d)=>{
    const items=[];
    day.exercises.forEach((ex,i)=>{
      const L=logs[logKey(w,d,i)]; if(!L||!L.date||!L.sets) return;
      const done=L.sets.filter(s=>s.done);
      if(!done.length) return;
      const nm=(picks&&picks[logKey(w,d,i)]&&(!ex.opts||ex.opts.includes(picks[logKey(w,d,i)])))?picks[logKey(w,d,i)]:ex.name;
      const bw=isBW(nm);
      const parts=done.map(s=>{
        const kg=s.kg!==''&&s.kg!=null?Number(s.kg):null, rp=(s.reps!==''&&s.reps!=null)?s.reps:'—';
        return (bw||!kg)?`×${rp}`:`${fmtKg(kg)}×${rp}`;
      });
      items.push({name:nm,parts,rpe:ex.rpe,date:L.date});
    });
    if(items.length){
      const dt=items[0].date;
      (byDate[dt]=byDate[dt]||[]).push({week:wk.name,day:day.day,items});
    }
  }));
  return byDate;
}

/* 週ごとのベストE1RM（配列 index = 週）を返す */
function collectE1RMFrom(logs){
  const n=PROGRAM.length;
  const out={sq:new Array(n).fill(null),bp:new Array(n).fill(null),dl:new Array(n).fill(null)};
  PROGRAM.forEach((wk,w)=>wk.days.forEach((day,d)=>day.exercises.forEach((ex,i)=>{
    const lift=MAIN[ex.name]; if(!lift) return;
    const L=logs[logKey(w,d,i)]; if(!L||!L.sets) return;
    L.sets.forEach(s=>{
      if(!s.done) return;
      const e=e1rm(Number(s.kg),Number(s.reps),Number(s.rpe));
      if(e && (out[lift][w]==null || e>out[lift][w])) out[lift][w]=e;
    });
  })));
  return out;
}
function weekLabels(){
  return PROGRAM.map(w=>w.name.replace(' (deload)','*').replace('MAX TEST','MAX'));
}
function collectE1RM(){ return collectE1RMFrom(S.logs); }
function collectVolumeFrom(logs){
  return PROGRAM.map((wk,w)=>{
    let t=0;
    wk.days.forEach((day,d)=>day.exercises.forEach((ex,i)=>{
      const L=logs[logKey(w,d,i)]; if(!L||!L.sets) return;
      L.sets.forEach(s=>{ if(s.done&&s.kg&&s.reps) t+=Number(s.kg)*Number(s.reps); });
    }));
    return t;
  });
}
function collectVolume(){ return collectVolumeFrom(S.logs); }
function bestE1From(logs,lift){
  const m=collectE1RMFrom(logs)[lift]; let b=null;
  m.forEach(v=>{ if(v!=null && (!b||v>b)) b=v; });
  return b;
}

function chartColors(){
  const cs=getComputedStyle(document.body);
  return {
    sub:(cs.getPropertyValue('--sub2')||'#66605b').trim(),
    grid:(cs.getPropertyValue('--line')||'#e9e5e0').trim()
  };
}
function drawLine(cv,labels,series){
  const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height);
  const C=chartColors();
  g.font='20px sans-serif';
  const vals=series.flatMap(s=>s.pts).filter(v=>v!=null);
  if(!vals.length){ g.fillStyle=C.sub; g.fillText('記録がまだありません。セットを完了すると表示されます。',40,180); return; }
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){mn-=10;mx+=10;} const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const L=70,R=15,T=15,B=50,W=cv.width-L-R,H=cv.height-T-B;
  for(let i=0;i<=4;i++){
    const y=T+H*i/4, v=mx-(mx-mn)*i/4;
    g.strokeStyle=C.grid; g.beginPath(); g.moveTo(L,y); g.lineTo(L+W,y); g.stroke();
    g.fillStyle=C.sub; g.fillText(Math.round(v),8,y+7);
  }
  const xp=i=>labels.length===1?L+W/2:L+W*i/(labels.length-1);
  const yp=v=>T+H*(1-(v-mn)/(mx-mn));
  g.fillStyle=C.sub;
  g.font='17px sans-serif';
  labels.forEach((lb,i)=>{
    g.save(); g.translate(xp(i),cv.height-10); g.rotate(-0.42);
    g.fillText(lb,-g.measureText(lb).width,0); g.restore();
  });
  series.forEach(s=>{
    g.strokeStyle=s.color; g.fillStyle=s.color; g.lineWidth=3;
    g.setLineDash(s.dash?[8,6]:[]);
    let started=false; g.beginPath();
    s.pts.forEach((v,i)=>{ if(v==null)return; const x=xp(i),y=yp(v); if(!started){g.moveTo(x,y);started=true;}else g.lineTo(x,y); });
    g.stroke();
    g.setLineDash([]);
    s.pts.forEach((v,i)=>{ if(v==null)return; g.beginPath(); if(s.dash){g.lineWidth=2;g.strokeStyle=s.color;g.arc(xp(i),yp(v),5,0,7);g.stroke();}else{g.arc(xp(i),yp(v),5,0,7);g.fill();} });
    g.lineWidth=3;
  });
}
function drawBars(cv,labels,vals){
  const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height);
  const C=chartColors();
  g.font='18px sans-serif';
  const mx=Math.max(...vals,1);
  const L=60,R=10,T=12,B=44,W=cv.width-L-R,H=cv.height-T-B;
  for(let i=0;i<=3;i++){
    const y=T+H*i/3, v=mx*(1-i/3);
    g.strokeStyle=C.grid; g.beginPath(); g.moveTo(L,y); g.lineTo(L+W,y); g.stroke();
    g.fillStyle=C.sub; g.fillText((v/1000).toFixed(1)+'t',6,y+6);
  }
  const bw=W/labels.length;
  labels.forEach((lb,i)=>{
    const v=vals[i];
    const h=H*v/mx;
    g.fillStyle=lb.includes('*')?'#c98a12':(lb==='MAX'?'#1fa06a':'#d92b2b');
    if(v>0) g.fillRect(L+bw*i+bw*0.18,T+H-h,bw*0.64,h);
    g.fillStyle=C.sub;
    g.save(); g.translate(L+bw*i+bw*0.5,cv.height-6); g.rotate(-0.5); g.fillText(lb,-18,0); g.restore();
  });
}

function extractConfigObject(raw){
  // コメント除去（// と /* */）
  let t=raw.replace(/\/\*[\s\S]*?\*\//g,'').replace(/^\s*\/\/.*$/gm,'');
  // apiKey を含むオブジェクトを探して、対応する } までを切り出す
  const anchor=t.search(/firebaseConfig\s*=\s*\{/);
  let start;
  if(anchor>=0){ start=t.indexOf('{',anchor); }
  else{
    const ak=t.indexOf('apiKey');
    if(ak<0) return null;
    start=t.lastIndexOf('{',ak);
  }
  if(start<0) return null;
  let depth=0;
  for(let i=start;i<t.length;i++){
    const c=t[i];
    if(c==='{') depth++;
    else if(c==='}'){ depth--; if(depth===0) return t.slice(start,i+1); }
  }
  return null;
}
function applyFBSettings(){

  const objText=extractConfigObject(raw);
  if(!objText){ toast('configが見つかりません（apiKeyの行を含めて貼り付け）'); return; }
  let cfg;
  try{ cfg=(new Function('return '+objText))(); }catch(e){ toast('configの解析に失敗しました'); return; }
  if(!cfg||!cfg.apiKey||!cfg.projectId){ toast('apiKey/projectIdが見つかりません'); return; }
  if(!cfg.databaseURL) cfg.databaseURL=`https://${cfg.projectId}-default-rtdb.asia-southeast1.firebasedatabase.app`;
  FB.config=cfg; FB.name=name; saveFB();
  toast('接続します…');
  connectFB();
}

function dopaFire(w,d,i){
  if(dBusy) return;
  const now=Date.now();
  dCombo = (now-dLastTick < 6*60*1000) ? dCombo+1 : 1;
  dLastTick=now;
  if(dCombo>(S.dopaMaxCombo||0)){ S.dopaMaxCombo=dCombo; }

  const ex=PROGRAM[w].days[d].exercises[i];
  const nm=effName(w,d,i);
  const L=getLog(w,d,i,ex);
  const allDone=L.sets.length>0 && L.sets.every(s=>s.done);
  // 自己ベスト判定
  let cur=null;
  L.sets.forEach(s=>{ if(!s.done) return; const e=e1rm(Number(s.kg),Number(s.reps),Number(s.rpe)); if(e&&(!cur||e>cur)) cur=e; });
  const hist=lastRecordFor(nm, logKey(w,d,i));
  const isPR = !!(cur && hist && hist.e1 && cur > hist.e1*1.002);

  let level='small', reason='';
  if(isPR){ level='big'; reason=`${nm} 自己ベスト更新！`; }
  else if(allDone){ level='mid'; reason=`${nm} 全セット完了`; }
  else if(Math.random()<0.16){ level='mid'; reason='ボーナス揃い'; }
  else if(Math.random()<0.035){ level='big'; reason='🎰 プレミア当選'; }

  const base = level==='big'?77777 : level==='mid'? (2000+Math.floor(Math.random()*3000)) : (100+Math.floor(Math.random()*400));
  const pt = base * Math.min(5, Math.max(1, Math.round(dCombo/3)||1));
  S.dopaPT=(S.dopaPT||0)+pt;

/* 無音＋最後にビープが入ったWAVを生成し、鳴らし続けることで
   画面を閉じてもバックグラウンドで音が鳴るようにする */
function buildTimerWav(sec){
  const SR=8000, beepSec=2.2, total=sec+beepSec;
  const n=Math.floor(SR*total);
  const buf=new ArrayBuffer(44+n*2), view=new DataView(buf);
  const wr=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); };
  wr(0,'RIFF'); view.setUint32(4,36+n*2,true); wr(8,'WAVE'); wr(12,'fmt ');
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,SR,true); view.setUint32(28,SR*2,true);
  view.setUint16(32,2,true); view.setUint16(34,16,true); wr(36,'data'); view.setUint32(40,n*2,true);
  const silentN=Math.floor(SR*sec);
  for(let i=0;i<n;i++){
    let v=0;
    if(i<silentN){
      v=(i%1600===0)?24:0; // 極小パルス：iOSの再生セッション維持用（ほぼ無音）
    }else{
      const t=(i-silentN)/SR;
      const seg=Math.floor(t/0.55);            // 0.55秒ごとに4回鳴らす
      const ph=t-seg*0.55;
      if(seg<4 && ph<0.28){
        const env=Math.sin(Math.PI*Math.min(1,ph/0.28));
        v=Math.sin(2*Math.PI*880*t)*22000*env;
      }
    }
    view.setInt16(44+i*2, v, true);
  }
  return new Blob([buf],{type:'audio/wav'});
}
function setAudioSession(type){
  try{ if(navigator.audioSession) navigator.audioSession.type=type; }catch(e){}
}
function ensureAC(){
  if(!tAC){ try{ tAC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(tAC && tAC.state==='suspended') tAC.resume().catch(()=>{});
  return tAC;
}
/* 音楽優先モード：音楽に重ねて鳴らす（AudioContextに先の時刻で予約） */
function scheduleMixBeeps(afterSec){
  const ac=ensureAC(); if(!ac) return;
  clearScheduled();
  const t0=ac.currentTime+Math.max(0,afterSec);
  for(let n=0;n<4;n++){
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value=880;
    const st=t0+n*0.55;
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(0.35,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.28);
    o.start(st); o.stop(st+0.3);
    tScheduled.push(o);
  }
}
function clearScheduled(){
  tScheduled.forEach(o=>{ try{ o.stop(); }catch(e){} });
  tScheduled=[];
}
function startTimer(){
  tRun=true; tEnd=Date.now()+tBase*1000; saveTimer();
  if(S.sound==='sure'){
    // 確実に鳴らすモード：無音WAVで再生を維持（他アプリの音楽は停止します）
    setAudioSession('playback');
    try{
      if(tAudioURL) URL.revokeObjectURL(tAudioURL);
      tAudioURL=URL.createObjectURL(buildTimerWav(tBase));
      tAudio=new Audio(tAudioURL);
      tAudio.preload='auto';
      tAudio.play().catch(()=>{});
    }catch(e){}
  }else{
    // 音楽優先モード：音楽を止めずに重ねて鳴らす
    setAudioSession('ambient');
    scheduleMixBeeps(tBase);
  }
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().catch(()=>{});
  }
  clearInterval(tInt);
  tInt=setInterval(()=>{
    if(tLeftNow()<=0) fireTimer();
    paintT();
  },250);
  paintT();
}
function stopTimer(fired){
  tRun=false; clearInterval(tInt); tInt=null; saveTimer();
  if(!fired){
    if(tAudio){ try{ tAudio.pause(); }catch(e){} }
    clearScheduled();
  }
  paintT();
}
function fireTimer(lateSec){
  stopTimer(true);
  if(navigator.vibrate) navigator.vibrate([300,120,300,120,500]);
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('レスト終了！', {body:'次のセットへ 💪', tag:'rest', renotify:true});
    }
  }catch(e){}
  if(document.visibilityState==='visible'){
    if(S.sound!=='sure') scheduleMixBeeps(0); else beep();
    toast(lateSec>2 ? `レスト終了（${fmtT(lateSec)}前に完了）` : 'レスト終了！次のセットへ');
  }
}
/* 復帰時／再訪問時にタイマー状態を復元 */
function restoreTimer(){
  try{
    const t=JSON.parse(localStorage.getItem(TKEY));
    if(!t) return;
    tBase=t.base;
    if(t.end>Date.now()){
      tEnd=t.end; tRun=true;
      clearInterval(tInt);
      tInt=setInterval(()=>{ if(tLeftNow()<=0) fireTimer(); paintT(); },250);
    }else{
      // 離れている間に終了していた場合は復帰時に知らせる
      localStorage.removeItem(TKEY);
      const late=Math.round((Date.now()-t.end)/1000);
      if(late<600) setTimeout(()=>fireTimer(late),300);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(tRun && tLeftNow()<=0) fireTimer(Math.round((Date.now()-tEnd)/1000)); else paintT();
  }
});

  const box=document.getElementById('installBox'), body=document.getElementById('installBody');
  if(!box||!body) return;
  if(isStandalone() || localStorage.getItem(INSTKEY)==='1'){ box.classList.remove('show'); return; }
  if(deferredPrompt){
    body.innerHTML=`<p>ホーム画面に追加すると全画面で開き、電波がなくても使えます。</p>
      <button class="ibtn" onclick="doInstall()">インストールする</button>
      <button class="ilater" onclick="hideInstall()">あとで</button>`;
    box.classList.add('show');
  }else if(isIOS() && !isStandalone()){
    body.innerHTML=`<p>ホーム画面に追加すると全画面で開き、電波がなくても使えます。</p>
      <ol><li>下の<b>共有ボタン</b>（□に↑）をタップ</li>
      <li><b>「ホーム画面に追加」</b>を選ぶ</li>
      <li>右上の<b>「追加」</b>をタップ</li></ol>
      <button class="ilater" onclick="hideInstall()">この案内を閉じる</button>`;
    box.classList.add('show');
  }else{
    box.classList.remove('show');
  }
}
function hideInstall(){
  localStorage.setItem(INSTKEY,'1');
  document.getElementById('installBox').classList.remove('show');
  toast('設定タブからいつでも表示できます');
}
async function doInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const r=await deferredPrompt.userChoice.catch(()=>null);
  deferredPrompt=null;
  document.getElementById('installBox').classList.remove('show');
  if(r && r.outcome==='accepted') toast('インストールしました！');
}
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e; showInstall();
});
window.addEventListener('appinstalled', ()=>{
  deferredPrompt=null;
  localStorage.setItem(INSTKEY,'1');
  document.getElementById('installBox').classList.remove('show');
  toast('インストール完了！ホーム画面から開けます');
});
function resetInstallHint(){
  localStorage.removeItem(INSTKEY); showInstall();
  toast(isStandalone()?'すでにインストール済みです':'インストール案内を表示しました');
}

/* init */
applyTheme();
restoreTimer();
paintT();
render();
connectFB();
showInstall();
</script>
</body>
</html>
